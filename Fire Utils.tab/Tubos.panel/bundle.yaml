title: Ferramentas de Tubos
tooltip: Inserção e conexão de componentes na modelagem de tubulações
author: Fire Utils
# Os nomes abaixo são os das pastas .pushbutton, não os títulos exibidos:
# é por eles que o pyRevit casa o layout. "Conectar Tubo" (o título) estava
# listado aqui antes e não correspondia a pasta nenhuma, então este layout
# era ignorado — passava despercebido porque havia um único botão.
layout:
  - Inserir Hidrante
  - Inserir Hidrante por Nivel
  - Inserir Hidrante com Abrigo
  - Conectar Abrigo
  - Conectar Tubulação
