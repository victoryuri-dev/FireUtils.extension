<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fire Utils · Memorial</title>
  <link rel="stylesheet" href="/site/style.css">
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <a id="back-link" href="/dashboard" class="topbar-back">&#8592; Projeto</a>
      <span id="topbar-brand" class="topbar-brand">Memorial</span>
    </div>
    <div class="topbar-right">
      <span id="topbar-estado" class="topbar-status"></span>
    </div>
  </div>

  <div class="wrapper" id="app">
    <div class="loading-state">Carregando...</div>
  </div>

  <script src="/site/auth.js"></script>
  <script src="/site/memorial.js"></script>
  <script>
    'use strict';

    (function () {
      var user = Auth.require();
      if (!user) return;

      var params  = new URLSearchParams(window.location.search);
      var id      = decodeURIComponent(params.get('id') || '');
      var tipo    = params.get('tipo'); // 'hid' | 'sai'

      var projects = [];
      try { projects = JSON.parse(localStorage.getItem('fu_projects') || '[]'); } catch (e) {}

      var proj = projects.find(function (p) { return p.id === id; });
      if (!proj) { window.location.href = '/dashboard'; return; }

      // Back link aponta para o projeto correto
      document.getElementById('back-link').href = '/project?id=' + encodeURIComponent(proj.id);

      var app      = document.getElementById('app');
      var brand    = document.getElementById('topbar-brand');
      var estadoEl = document.getElementById('topbar-estado');

      if (proj.estado || proj.uf) estadoEl.textContent = proj.estado || proj.uf;

      if (tipo === 'hid' && proj.hidrantes) {
        brand.textContent = 'Hidrantes';
        document.title    = 'Fire Utils · Hidrantes — ' + proj.nome;
        app.innerHTML     = renderHidrantes(proj.hidrantes);
      } else if (tipo === 'sai' && proj.saidas) {
        brand.textContent = 'Saídas de Emergência';
        document.title    = 'Fire Utils · Saídas — ' + proj.nome;
        app.innerHTML     = renderSaidas(proj.saidas);
      } else {
        app.innerHTML = '<div class="empty-state"><p>Dados não encontrados.</p></div>';
      }
    })();
  </script>

</body>
</html>
